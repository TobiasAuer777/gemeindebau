:root{
  --papier:#f6f5f1; --flaeche:#ffffff; --flaeche2:#f1efe9; --linie:#e4e1d8; --raster:#ece9e1;

}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 520px at 100% -8%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 62%) no-repeat,var(--papier);

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flamme);outline-offset:2px}
.mass{font-family:var(--f-mass);font-size:.92em;font-variant-numeric:tabular-nums}
.etikett{font:600 10.5px/1 var(--f-text);text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.leise{color:var(--text2)}
.klein{font-size:13px}

/* ---------- Rahmen */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.seite{display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px;background:color-mix(in srgb,var(--flaeche) 82%,transparent);border-right:1px solid var(--linie);backdrop-filter:blur(8px);
  position:sticky;top:0;height:100vh;overflow:auto}
.marke{display:flex;gap:11px;align-items:center;padding:4px 8px 16px}
.marke img{height:44px;width:auto}
.marke b{display:block;font:600 20px/1.05 var(--f-titel);color:var(--tinte);letter-spacing:-.01em}
.marke span{display:block;font-size:12px;color:var(--text2);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 12px;border-radius:var(--r-klein);
  color:var(--text2);font-weight:500;cursor:pointer;text-align:left}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--flaeche2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--flaeche2);color:var(--tinte);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav .trenn{height:1px;background:var(--linie);margin:8px 6px}
.ich{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r);background:var(--flaeche2);cursor:pointer;border:0;text-align:left}
.ich small{display:block;color:var(--text3);font-size:12px}
.haupt{min-width:0;padding:18px clamp(16px,3.2vw,44px) 56px}
.oberleiste{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;min-height:38px}
.btn.thema-knopf{width:38px;height:38px;padding:0;border-radius:999px;border:1px solid var(--linie);background:var(--flaeche);color:var(--text2);box-shadow:var(--schatten)}
.thema-knopf:hover{color:var(--tinte);border-color:var(--text3)}
.btn.thema-knopf svg{flex:none;width:18px;height:18px}
.tor .thema-knopf{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5}
.kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.kopf .unter{color:var(--text2);margin-top:6px}
.unten{display:none}
.demo-band{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-weich);color:var(--text);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  padding:9px 12px;border-radius:var(--r);margin-bottom:18px;font-size:13.5px}
.demo-band b{font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .seite{display:none}
  .haupt{padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .oberleiste{display:none}
  .handykopf{display:flex!important}
  .unten{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--flaeche);
    border-top:1px solid var(--linie);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .unten button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer}
  .unten button svg{width:22px;height:22px}
  .unten button[aria-current="page"]{color:var(--blau)}
  h1{font-size:26px}
}
.handykopf{display:none;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 14px}
.handykopf .marke{padding:0}
.handykopf .marke img{height:36px}

/* ---------- Bausteine */
.raster{display:grid;gap:16px}
.r2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.r3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:20px;box-shadow:var(--schatten);min-width:0}
.karte>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.stapel{display:flex;flex-direction:column;gap:10px}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zeile.weit{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--linie);background:var(--flaeche);color:var(--text);
  padding:9px 15px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--text3)}
.btn svg{width:17px;height:17px}
.btn.primaer{background:var(--primaer);border-color:var(--primaer);color:var(--auf-primaer)}
.btn.primaer:hover{filter:brightness(1.12)}
.btn.flamme{background:var(--flamme);border-color:var(--flamme);color:#fff}
.btn.still{border-color:transparent;background:none;color:var(--text2)}
.btn.still:hover{background:var(--flaeche2)}
.btn.klein{padding:5px 9px;font-size:13px}
.btn.gefahr{color:var(--krit)}
.pille{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--flaeche2);color:var(--text2);white-space:nowrap}
.pille.offen{background:var(--flaeche2);color:var(--text2)}
.pille.geplant,.pille.freigegeben{background:var(--blau-weich);color:var(--blau)}
.pille.in_arbeit,.pille.bestellt,.pille.angefragt{background:var(--warn-weich);color:var(--warn)}
.pille.erledigt,.pille.geliefert{background:var(--ok-weich);color:var(--ok)}
.pille.abgelehnt{background:var(--krit-weich);color:var(--krit)}
.pille.bedarf{background:var(--flaeche2);color:var(--text2)}
.pille.vorschlag{background:var(--gold-weich);color:var(--warn)}
.punkt{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px/1 var(--f-text);color:#fff;flex:none;letter-spacing:.02em}
.avatare{display:flex}
.avatare .avatar{margin-left:-7px;box-shadow:0 0 0 2px var(--flaeche)}
.avatare .avatar:first-child{margin-left:0}
.leer{border:1.5px dashed var(--linie);border-radius:var(--r);padding:22px;text-align:center;color:var(--text2);background:color-mix(in srgb,var(--flaeche) 70%,transparent)}
.liste{display:flex;flex-direction:column}
.liste>*{padding:11px 0;border-top:1px solid var(--linie)}
.liste>*:first-child{border-top:0;padding-top:2px}
.tabelle-rahmen{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px/1 var(--f-text);text-transform:uppercase;letter-spacing:.08em;color:var(--text3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--linie);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--linie);vertical-align:middle}
tr:last-child td{border-bottom:0}
.zahl{font:600 36px/1 var(--f-titel);color:var(--tinte);letter-spacing:-.02em}
.zahl small{font:500 13px var(--f-text);color:var(--text2);margin-left:4px}
.reiter{display:flex;gap:4px;background:var(--flaeche2);padding:4px;border-radius:var(--r);flex-wrap:wrap}
.reiter button{border:0;background:none;padding:7px 12px;border-radius:var(--r-klein);font-weight:600;color:var(--text2);cursor:pointer;font-size:14px}
.reiter{border-radius:999px}
.reiter button{border-radius:999px}
.reiter button[aria-pressed="true"]{background:var(--flaeche);color:var(--tinte);box-shadow:var(--schatten)}

/* Formulare */
label.feld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--text2)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linie);border-radius:var(--r-klein);background:var(--flaeche);font-size:15px;font-weight:400;color:var(--text)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 3px var(--blau-weich)}
.felder{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--linie);background:var(--flaeche);padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text2);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--primaer);border-color:var(--primaer);color:var(--auf-primaer)}
.chip .nr{background:var(--auf-primaer);color:var(--primaer);border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.fehler{color:var(--krit);font-size:13.5px}
.link{background:none;border:0;padding:2px 0;color:var(--blau);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--flamme)}
.hinweis{background:var(--blau-weich);color:var(--text);border-radius:var(--r);padding:10px 12px;font-size:13.5px}

/* Dialog (Schublade) */
.schleier{position:fixed;inset:0;background:rgba(10,16,32,.45);z-index:60;display:flex;justify-content:flex-end}
.schublade{background:var(--flaeche);width:min(560px,100%);height:100%;overflow:auto;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));
  box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px;animation:rein .18s ease-out}
.schublade>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:sticky;top:-20px;background:var(--flaeche);padding:20px 0 8px;margin-top:-20px;z-index:2}
@keyframes rein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.schublade{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--primaer);color:var(--auf-primaer);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--schatten)}
@media (min-width:861px){.toast{bottom:28px}}

/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kal .wt{font:600 11px/1 var(--f-text);text-transform:uppercase;letter-spacing:.08em;color:var(--text3);text-align:center;padding:4px 0}
.tag{min-height:92px;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r-klein);padding:7px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;min-width:0}
.tag:hover{border-color:var(--text3)}
.tag.fremd{opacity:.45}
.tag.sa{background:var(--gold-weich);border-color:color-mix(in srgb,var(--gold) 55%,var(--linie))}
.tag.heute{box-shadow:inset 0 0 0 2px var(--blau)}
.tag.ich-da{box-shadow:inset 0 -4px 0 var(--flamme)}
.tag .nr{font:600 16px/1 var(--f-titel);color:var(--tinte);display:flex;justify-content:space-between;align-items:center}
.tag .nr .anz{font:600 11px var(--f-text);color:var(--text2)}
.tag .namen{font-size:11.5px;color:var(--text2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
@media (max-width:600px){.tag{min-height:58px;padding:5px}.tag .namen{display:none}.kal{gap:4px}}
.leiste14{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.leiste14 .s{display:flex;flex-direction:column;align-items:center;gap:4px}
.leiste14 .bal{width:100%;border-radius:4px;background:var(--blau);min-height:3px}
.leiste14 .s.sa .bal{background:var(--flamme)}
.leiste14 .lbl{font:600 10.5px var(--f-mass);color:var(--text3)}

/* Aufgaben-Brett */
.brett{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.spalte{background:color-mix(in srgb,var(--flaeche2) 80%,transparent);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.spalte>h3{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 4px}
.akarte{background:var(--flaeche);border:1px solid var(--linie);border-left:4px solid var(--farbe,var(--linie));border-radius:var(--r-klein);padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left}
.akarte:hover{border-color:var(--text3);border-left-color:var(--farbe,var(--text3))}
.akarte b{font-weight:600;color:var(--tinte);font-size:14.5px;line-height:1.3}
@media (max-width:860px){.brett{grid-template-columns:repeat(4,minmax(78vw,1fr));scroll-snap-type:x mandatory}.spalte{scroll-snap-align:start}}

/* Feed / Fotos */
.foto-reihe{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.foto-reihe img,.foto-reihe .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;background:var(--flaeche2);display:block;max-width:100%}
.ph{display:grid!important;place-items:center;color:var(--text3);font-size:12px}
.feed-tag{display:flex;gap:14px}
.feed-tag .datum{flex:none;width:58px;text-align:center;padding-top:2px}
.feed-tag .datum b{display:block;font:600 26px/1 var(--f-titel);color:var(--tinte)}
.feed-tag .datum span{font:600 11px var(--f-text);text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.feed-tag .inhalt{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-left:2px solid var(--linie);padding-left:16px}

/* Halle */
.halle-rahmen{position:relative;background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden}
.plan-svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.palette{display:flex;flex-wrap:wrap;gap:7px}
.dreid{position:relative;width:100%;height:min(68vh,640px);background:#0b1020;border-radius:var(--r);overflow:hidden;touch-action:none}
.dreid canvas{display:block;width:100%;height:100%}
.dreid .hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.dreid .hud>*{pointer-events:auto}
.dreid .hud .tafel{background:rgba(8,12,26,.72);color:#e8edf8;border-radius:8px;padding:7px 10px;font-size:12.5px;backdrop-filter:blur(6px)}
.joy{position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.55)}
@media (hover:hover) and (pointer:fine){.joy{display:none}}

/* Login */
.tor{min-height:100%;display:grid;place-items:center;padding:64px 16px 24px}
.tor .karte{width:min(440px,100%);padding:26px}
.tor .marke{justify-content:center;flex-direction:column;text-align:center;padding:0 0 18px}
.tor .marke img{height:84px}
.tor .marke b{font-size:30px}
.tor .karte{box-shadow:0 1px 1px rgba(0,0,0,.04),0 30px 60px -30px rgba(22,31,54,.35)}
/* Zugangsdaten zum Weiterschicken */
.vorlage{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:12px 14px;border-radius:12px;border:1px solid var(--linie);background:var(--flaeche2);font:inherit;font-size:.92rem;line-height:1.5}
a.btn{text-decoration:none}
/* Tagesplan */
.tp-wrap{display:flex;flex-direction:column;gap:16px;max-width:920px}
.tp-nav input[type=date]{padding:7px 10px;border-radius:999px}
.tp-balken{height:8px;border-radius:99px;background:var(--flaeche2);overflow:hidden}
.tp-balken i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,var(--gold)));transition:width .3s ease}
.tp-liste{display:flex;flex-direction:column}
.tp-punkt{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:13px 0;border-top:1px solid var(--linie)}
.tp-punkt:first-child{border-top:0;padding-top:2px}
.tp-haken{width:30px;height:30px;border-radius:9px;border:1.5px solid color-mix(in srgb,var(--text3) 80%,transparent);background:var(--flaeche);display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;transition:background-color .15s,border-color .15s}
.tp-haken:hover{border-color:var(--ok)}
.tp-haken svg{width:18px;height:18px}
.tp-haken[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--flaeche)}
.tp-text{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:4px}
.tp-text b{font-weight:600;color:var(--tinte);line-height:1.35}
.tp-punkt.fertig .tp-text b{color:var(--text3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text3) 60%,transparent)}
.tp-wer{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:600;color:var(--blau)}
.tp-wer svg,.tp-wann svg{width:14px;height:14px;flex:none}
.tp-wann{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ok)}
.tp-aktionen{display:flex;gap:2px}
.tp-aktionen .btn{padding:6px}
@media print{
  .seite,.unten,.oberleiste,.handykopf,.demo-band,.tp-aktionen,.tp-nav,[data-a="tpNeu"],[data-a="tpAufgabenNach"],.hinweis{display:none!important}
  .app{display:block} body{background:#fff} .haupt{padding:0}
  .karte{box-shadow:none;break-inside:avoid;border-color:#ccc} .tp-haken{border-color:#555}
}
.zahl{white-space:nowrap}
/* Bekannte Personen: Zugänge anlegen */
.bk-liste{display:flex;flex-direction:column}
.bk-zeile{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(170px,1.4fr) minmax(130px,.9fr) minmax(150px,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--linie)}
.bk-zeile:first-child{border-top:0}
.bk-name{display:flex;flex-direction:column;min-width:0}
.bk-zeile input,.bk-zeile select{padding:8px 10px;font-size:14px}
@media (max-width:980px){.bk-zeile{grid-template-columns:1fr 1fr}.bk-name{grid-column:1/-1}.bk-zeile .btn{grid-column:1/-1}}
.bk-fertige{display:flex;flex-direction:column;gap:8px}
.bk-fertig{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--flaeche2)}
@media print{
  body.druck-zugaenge #ansicht > :not(#bekannte){display:none!important}
  body.druck-zugaenge #bekannte .bk-liste,body.druck-zugaenge #bekannte header .pille,body.druck-zugaenge #bekannte .bk-druck .zeile .btn,body.druck-zugaenge #bekannte .bk-fertig .btn{display:none!important}
}

function tagesplanEntwurf(datum, aufgaben, nameVonId){
  const P=(abschnitt,titel,notiz,sort,extra={})=>({datum,abschnitt,titel,notiz:notiz||null,wer:null,aufgabe_id:null,sort,erledigt:false,erledigt_von:null,erledigt_um:null,...extra});
  const arbeit=aufgaben.filter(a=>a.datum===datum&&a.status!=="erledigt").map((a,i)=>P("arbeit",a.titel,
    a.gewerk==="Mauern (Ytong)"?TP_MAUERN:(a.beschreibung||null),i,{aufgabe_id:a.id,wer:(a.zugewiesen||[]).map(nameVonId).filter(Boolean).join(", ")||null}));
  return [...TP_START.map(([t,n],i)=>P("start",t,n,i)),...arbeit,...TP_ENDE.map(([t,n],i)=>P("ende",t,n,i))];
}

    if(data.session){ try{ await zweit.auth.signOut({scope:"local"}); }catch(e){} }
    const {error:e2}=await this.sb.rpc("zugang_anlegen",{p_id:u.id,p_name:name,p_rolle:rolle}); if(e2) throw new Error(e2.message);

  async abmelden(){ await this.sb.auth.signOut(); },

    const {data}=await this.sb.from("profil").select("*").eq("id",s.user.id).maybeSingle(); return data; },
  async alle(t){ const {data,error}=await this.sb.from(t).select("*"); if(error) throw error; return data; },

  async neuViele(t,liste){ const {error}=await this.sb.from(t).insert(liste); if(error) throw error; },
  async aendern(t,id,p){ const {data,error}=await this.sb.from(t).update(p).eq("id",id).select().maybeSingle(); if(error) throw error; return data; },
  async loeschen(t,id){ const {error}=await this.sb.from(t).delete().eq("id",id); if(error) throw error; },

  async fotoUrls(pfade){ const o={}; if(!pfade.length) return o;

/* Bild verkleinern (spart Datenvolumen auf der Baustelle) */
function verkleinern(datei,max,q,alsBlob){
  return new Promise((ok,fehl)=>{ const r=new FileReader(); r.onerror=fehl; r.onload=()=>{ const img=new Image(); img.onerror=()=>fehl(new Error("Bild nicht lesbar"));
    img.onload=()=>{ const f=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*f); c.height=Math.round(img.height*f);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); if(alsBlob) c.toBlob(b=>ok(b),"image/jpeg",q); else ok(c.toDataURL("image/jpeg",q)); }; img.src=r.result; }; r.readAsDataURL(datei); });
}

/* ---------- 2D-Grundriss als SVG ---------- */
function planSvg(objekte, opt={}){
  const S=20, R=40, W=HALLE.L*S+R*2, H=HALLE.B*S+R*2;  // 20 px pro Meter
  const p = v => (v*S+R).toFixed(1);
  const sel = opt.auswahl;
  let s = `<svg class="plan-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grundriss der Halle, 47,40 × 19,90 m Innenmaß">
  <defs>
    <pattern id="gp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="var(--text3)"/></pattern>
    <pattern id="sch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--text3)" stroke-width="1.2"/></pattern>
    <pattern id="m1" width="${S}" height="${S}" patternUnits="userSpaceOnUse" x="${R}" y="${R}"><path d="M ${S} 0 L 0 0 0 ${S}" fill="none" stroke="var(--raster)" stroke-width="1"/></pattern>
  </defs>
  <rect x="0" y="0" width="${W}" height="${H}" fill="var(--flaeche)"/>
  <rect x="${R}" y="${R}" width="${HALLE.L*S}" height="${HALLE.B*S}" fill="url(#m1)"/>`;
  RAEUME.forEach(r=>{ s+=`<rect x="${p(r.x)}" y="${p(r.y)}" width="${(r.w*S).toFixed(1)}" height="${(r.h*S).toFixed(1)}" fill="${r.haupt?'var(--blau-weich)':'var(--flaeche2)'}" opacity="${r.haupt?.55:.8}"/>`; });
  s+=`<rect x="${p(TECHNIK.x)}" y="${p(TECHNIK.y)}" width="${TECHNIK.w*S}" height="${TECHNIK.h*S}" fill="url(#gp)" stroke="var(--text3)" stroke-width="1"/>`;
  { const tx=p(TECHNIK.x+TECHNIK.w/2), ty=p(TECHNIK.y+TECHNIK.h/2);
    s+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-family="var(--f-titel)" font-weight="700" font-size="12" letter-spacing="1" fill="var(--tinte)" paint-order="stroke" stroke="var(--flaeche)" stroke-width="3" transform="rotate(-90 ${tx} ${ty})">TECHNIK</text>`; }
  s+=`<rect x="${p(BUEHNE.x)}" y="${p(BUEHNE.y)}" width="${BUEHNE.w*S}" height="${BUEHNE.h*S}" fill="url(#sch)" stroke="var(--tinte)" stroke-width="1.5"/>`;
  s+=`<line x1="${p(46.7-0.08)}" y1="${p(LED.y1)}" x2="${p(46.7-0.08)}" y2="${p(LED.y2)}" stroke="var(--flamme)" stroke-width="6" stroke-linecap="round"/>`;
  // Außenwand
  s+=`<rect x="${R-HALLE.wand*S/2}" y="${R-HALLE.wand*S/2}" width="${HALLE.L*S+HALLE.wand*S}" height="${HALLE.B*S+HALLE.wand*S}" fill="none" stroke="var(--tinte)" stroke-width="${HALLE.wand*S}"/>`;
  TUEREN_AUSSEN.forEach(t=>{ s+=`<line x1="${p(t.x1)}" y1="${p(t.y)}" x2="${p(t.x2)}" y2="${p(t.y)}" stroke="var(--flaeche)" stroke-width="${HALLE.wand*S+2}"/>`; });
  WAENDE.forEach(([x1,y1,x2,y2,a])=>{
    if(a==="abriss"){ s+=`<line x1="${p(x1)}" y1="${p(y1)}" x2="${p(x2)}" y2="${p(y2)}" stroke="var(--glut)" stroke-width="4.5" stroke-dasharray="7 5" opacity=".9"/>`; return; }
    const c=istNeu(a)?"var(--gold)":"var(--text2)";
    s+=`<line x1="${p(x1)}" y1="${p(y1)}" x2="${p(x2)}" y2="${p(y2)}" stroke="${c}" stroke-width="${istNeu(a)?6:4.5}" stroke-linecap="square"/>`;
    if(a==="neu-ra") s+=`<line x1="${p(x1)}" y1="${p(y1)}" x2="${p(x2)}" y2="${p(y2)}" stroke="var(--tinte)" stroke-width="1.6" stroke-dasharray="10 6"/>`; });
  // Beschriftung Rückbau + Ringanker
  s+=`<text x="${p(40.2)-6}" y="${p(2.1)}" text-anchor="end" font-family="var(--f-text)" font-weight="700" font-size="9.5" fill="var(--glut)">✕ Rückbau</text>`;
  s+=`<text x="${p(40.2)-6}" y="${p(17.8)}" text-anchor="end" font-family="var(--f-text)" font-weight="700" font-size="9.5" fill="var(--glut)">✕ Rückbau</text>`;
  [[46.7,13,2.6],[21.2,13,11.6]].forEach(([wx,dx,wy])=>{ const rx=p(wx)+dx, ry=p(wy); s+=`<text x="${rx}" y="${ry}" text-anchor="middle" font-family="var(--f-text)" font-weight="700" font-size="9" fill="var(--tinte)" paint-order="stroke" stroke="var(--flaeche)" stroke-width="3" transform="rotate(90 ${rx} ${ry})">RINGANKER</text>`; });
  // Beschriftung
  RAEUME.forEach(r=>{ const cx=p(r.x+r.w/2), cy=p(r.ly!=null?r.y+r.ly:r.y+r.h/2); const fs=r.haupt?15:r.klein?8.5:10;
    s+=`<text x="${cx}" y="${cy}" text-anchor="middle" font-family="var(--f-titel)" font-weight="600" font-size="${fs}" fill="var(--tinte)">${r.n}</text>`;
    if(r.m2) s+=`<text x="${cx}" y="${(+cy+fs+2).toFixed(1)}" text-anchor="middle" font-family="var(--f-mass)" font-size="9.5" fill="var(--text2)">NGF ${r.m2} m²</text>`; });
  s+=`<text x="${p(BUEHNE.x+BUEHNE.w/2)}" y="${p(BUEHNE.y+BUEHNE.h/2)}" text-anchor="middle" font-family="var(--f-titel)" font-weight="700" font-size="13" fill="var(--tinte)" transform="rotate(-90 ${p(BUEHNE.x+BUEHNE.w/2)} ${p(BUEHNE.y+BUEHNE.h/2)})">BÜHNE · LED-Wand 10 × 3 m</text>`;
  // Umgebung
  const ue=(x,y,t,rot)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="var(--f-text)" font-weight="600" font-size="11" letter-spacing="1.2" fill="var(--text3)" ${rot?`transform="rotate(${rot} ${x} ${y})"`:''}>${t}</text>`;
  s+=ue(W/2,R-16,"HOF KINDER-SPIEL")+ue(W/2,H-12,"HOF EINGANG · PFLASTER")+ue(16,H/2,"KONZSTRASSE · PARKPLÄTZE",-90)+ue(W-14,H/2,"INDUSTRIESTRASSE",90);
  s+=`<text x="${p((TUEREN_AUSSEN[0].x1+TUEREN_AUSSEN[0].x2)/2)}" y="${p(HALLE.B)+18}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--flamme)">▲ Haupteingang</text>`;
  // Maßkette
  s+=`<g font-family="var(--f-mass)" font-size="10" fill="var(--text2)"><text x="${R+6}" y="${R-4}">0</text><text x="${p(HALLE.L)-30}" y="${R-4}">47,40 m</text></g>`;
  // Treppen
  TREPPEN.forEach(tr=>{ s+=`<rect x="${p(tr.x)}" y="${p(tr.y)}" width="${(tr.w*S).toFixed(1)}" height="${(tr.h*S).toFixed(1)}" fill="var(--flaeche)" stroke="var(--text2)" stroke-width="1"/>`;
    for(let i=1;i<6;i++) s+=`<line x1="${p(tr.x)}" y1="${p(tr.y+tr.h*i/6)}" x2="${p(tr.x+tr.w)}" y2="${p(tr.y+tr.h*i/6)}" stroke="var(--text2)" stroke-width=".8"/>`; });
  // Seitenplätze an der Bühne (rote Bezüge)
  if(opt.seiten){ s+=`<g fill="${STUHL.rot}">`; seitenPositionen().forEach(c=>{ const sw=(STUHL.breite-0.06)*S, sd=(STUHL.tiefe-0.04)*S; s+=`<rect x="${(c.x*S+R-sw/2).toFixed(1)}" y="${(c.y*S+R-sd/2).toFixed(1)}" width="${sw.toFixed(1)}" height="${sd.toFixed(1)}" rx="1.5"/>`; }); s+=`</g>`;
    SEITEN.forEach(g=>{ s+=`<text x="${p(BUEHNE.x+BUEHNE.w/2)}" y="${p(g.text)}" text-anchor="middle" font-family="var(--f-text)" font-weight="700" font-size="9" fill="${STUHL.rot}">${g.n}</text>`; }); }
  // Bestuhlung (umschaltbar)
  if(opt.bestuhlung){ const sw=(STUHL.breite-0.06)*S, sd=(STUHL.tiefe-0.04)*S; s+=`<g fill="${STUHL.farbe}">`;
    stuhlPositionen(opt.bestuhlung).forEach(c=>{ s+=`<rect x="${(c.x*S+R-sd/2).toFixed(1)}" y="${(c.y*S+R-sw/2).toFixed(1)}" width="${sd.toFixed(1)}" height="${sw.toFixed(1)}" rx="1.5"/>`; }); s+=`</g>`; }
  // Planobjekte
  (objekte||[]).forEach(o=>{ const k=OBJEKTE[o.typ]; if(!k) return; const cx=p(o.x), cy=p(o.y), w=k.w*S, d=k.d*S;
    const aktiv = sel===o.id;
    s+=`<g data-obj="${o.id}" transform="translate(${cx} ${cy}) rotate(${o.rot||0})" style="cursor:${opt.bearbeiten?'grab':'default'}">`;
    if(k.rund) s+=`<circle r="${w/2}" fill="${k.farbe}" fill-opacity=".85" stroke="${aktiv?'var(--flamme)':'#fff'}" stroke-width="${aktiv?3:1}"/>`;
    else if(o.typ==="esstisch"){ s+=`<rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="2" fill="${k.farbe}" stroke="${aktiv?'var(--flamme)':'#fff'}" stroke-width="${aktiv?3:1}"/>`;
      [-0.5,0,0.5].forEach(dx=>[-1,1].forEach(sy=>{ s+=`<rect x="${(dx*S-4.5).toFixed(1)}" y="${(sy*(d/2+4)-4.5).toFixed(1)}" width="9" height="9" rx="2" fill="${STUHL.farbe}"/>`; })); }
    else if(["schlagzeug","piano","bass","pult"].includes(o.typ)){ s+=`<rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="${o.typ==="schlagzeug"?12:2}" fill="${k.farbe}" stroke="${aktiv?'var(--flamme)':'#fff'}" stroke-width="${aktiv?3:1}"/>`;
      s+=`<text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-size="7" font-weight="700" fill="#fff" transform="rotate(${-(o.rot||0)})">${({schlagzeug:"Drums",piano:"Piano",bass:"Bass",pult:"Pult"})[o.typ]}</text>`; }
    else if(o.typ==="stuhlreihe"){ s+=`<rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" fill="transparent" stroke="${aktiv?'var(--flamme)':'none'}" stroke-width="2.5"/>`;
      for(let i=0;i<10;i++) s+=`<rect x="${-w/2+i*0.5*S+1}" y="${-d/2+1}" width="${0.5*S-2}" height="${d-2}" rx="2" fill="${k.farbe}"/>`; }
    else s+=`<rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="2" fill="${k.farbe}" fill-opacity=".85" stroke="${aktiv?'var(--flamme)':'#fff'}" stroke-width="${aktiv?3:1}"/>`;
    s+=`</g>`; });
  s+=`</svg>`;
  return s;
}

/* Bestuhlung Gottesdienstraum: 3 Blöcke, Blick zur Bühne. Stuhlbreite 0,50 m. */
const STUHL = {breite:0.5, tiefe:0.48, farbe:"#33508f", rot:"#a3262a"};
/* Seitenplätze neben der Bühne: je 2 Reihen à 7, Blick zur Bühnenmitte; Lobpreisteam bei den Pianos, Pastoren gegenüber */
const SEITEN = [
  {n:"Lobpreisteam", reihen:[BUEHNE_Y0()-0.55, BUEHNE_Y0()-1.5], blick:1,  text:0.35},
  {n:"Pastoren",     reihen:[BUEHNE_Y1()+0.55, BUEHNE_Y1()+1.5], blick:-1, text:19.75}];
function BUEHNE_Y0(){ return BUEHNE.y; } function BUEHNE_Y1(){ return BUEHNE.y+BUEHNE.h; }
function seitenPositionen(){ const out=[]; SEITEN.forEach(g=>g.reihen.forEach(y=>{ for(let i=0;i<7;i++) out.push({x:BUEHNE.x+0.4+i*STUHL.breite, y, theta:g.blick>0?-Math.PI/2:Math.PI/2, rot:true}); })); return out; }
const BESTUHLUNG = {
  300:{bloecke:[8,10,8],  abstand:0.95, gang:1.5, vorne:5.0},
  400:{bloecke:[9,12,9],  abstand:0.95, gang:1.2, vorne:4.5},
  500:{bloecke:[9,12,9],  abstand:0.85, gang:1.2, vorne:3.4}   // 0,85 m = 0,45 Sitz + 0,40 Durchgang (Minimum)
};
function bestuhlungInfo(n){ const b=BESTUHLUNG[n]; if(!b) return null; const proReihe=b.bloecke.reduce((s,x)=>s+x,0);
  const breite=proReihe*STUHL.breite+2*b.gang; const reihen=Math.ceil(n/proReihe);
  return {...b, proReihe, reihen, rand:(HALLE.B-breite)/2, erste:BUEHNE.x-b.vorne, letzte:BUEHNE.x-b.vorne-(reihen-1)*b.abstand}; }
function stuhlPositionen(n){
  const i=bestuhlungInfo(n); if(!i) return [];
  const out=[]; let rest=n;
  // y-Startpunkte der Blöcke
  const starts=[]; let y=i.rand; i.bloecke.forEach((b,k)=>{ starts.push(y); y+=b*STUHL.breite+(k<2?i.gang:0); });
  for(let r=0;r<i.reihen&&rest>0;r++){ const x=i.erste-r*i.abstand; let anz=i.bloecke.slice();
    if(rest<i.proReihe){ // letzte Reihe: zuerst Mittelblock, dann gleichmäßig außen – jeweils am Gang
      const m=Math.min(rest,anz[1]); const aussen=rest-m; anz=[Math.ceil(aussen/2),m,Math.floor(aussen/2)]; }
    anz.forEach((a,k)=>{ const voll=i.bloecke[k]; const off= k===0? voll-a : k===2? 0 : Math.floor((voll-a)/2);
      for(let s=0;s<a;s++) out.push({x, y:starts[k]+(off+s+0.5)*STUHL.breite}); });
    rest-=anz.reduce((s,x)=>s+x,0); }
  return out;
}
/* Grundeinrichtung: Rednerpult vorne Mitte, Instrumente hinten im Halbkreis, Esstische im Gemeinschaftsraum */
function grundeinrichtung(){
  const mitte=BUEHNE.y+BUEHNE.h/2, o=[];
  o.push({typ:"pult",x:+(BUEHNE.x+0.45).toFixed(2),y:mitte,rot:0,label:"Rednerpult"});
  // hinten im Halbkreis: Pianos nebeneinander (um 90° gedreht, Spieler blickt zur Kanzel), Schlagzeug Mitte, Bass rechts
  const hinten=BUEHNE.x+BUEHNE.w;
  o.push({typ:"piano",x:+(hinten-2.95).toFixed(2),y:+(BUEHNE.y+1.7).toFixed(2),rot:90,label:"Piano 1"});
  o.push({typ:"piano",x:+(hinten-1.35).toFixed(2),y:+(BUEHNE.y+1.7).toFixed(2),rot:90,label:"Piano 2"});
  o.push({typ:"schlagzeug",x:+(hinten-1.0).toFixed(2),y:mitte,rot:0,label:"Schlagzeug"});
  o.push({typ:"bass",x:+(hinten-1.1).toFixed(2),y:+(mitte+3.4).toFixed(2),rot:-30,label:"Bassgitarre"});
  // Gemeinschaftsraum: 4 × 4 Esstische, Buffet an der Küche
  [11.0,13.9,16.8,19.7].forEach(x=>[7.0,9.8,12.6,15.4].forEach(y=>o.push({typ:"esstisch",x,y,rot:0,label:"Esstisch"})));
  o.push({typ:"buffet",x:12.6,y:4.75,rot:0,label:"Buffet"});
  return o;
}
/* (alt) Bestuhlung als verschiebbare Reihen */
function bestuhlungVorschlag(){
  const reihen=[], abstand=0.95, mitte=(BUEHNE.y+BUEHNE.y+BUEHNE.h)/2;
  for(let x=BUEHNE.x-3.8; x>TECHNIK.x+TECHNIK.w+1.6; x-=abstand){
    reihen.push({typ:"stuhlreihe",x:+x.toFixed(2),y:+(mitte-0.75-2.5).toFixed(2),rot:90});
    reihen.push({typ:"stuhlreihe",x:+x.toFixed(2),y:+(mitte+0.75+2.5).toFixed(2),rot:90});
  }
  return reihen;
}

/* ---------- 3D (Three.js) ---------- */
function halle3d(container, objekte, opt={}){
  const THREE = window.THREE; if(!THREE){ container.innerHTML='<div class="leer">3D konnte nicht geladen werden.</div>'; return {stop(){}}; }
  const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  container.prepend(renderer.domElement);
  const szene=new THREE.Scene(); szene.background=new THREE.Color("#c9d6ea"); szene.fog=new THREE.Fog("#c9d6ea",60,140);
  const kam=new THREE.PerspectiveCamera(68,1,0.05,300);
  szene.add(new THREE.HemisphereLight("#ffffff","#8a8f99",0.85));
  const sonne=new THREE.DirectionalLight("#fff6e8",0.55); sonne.position.set(-20,40,-10); szene.add(sonne);
  [[12,10],[33,10],[44,10]].forEach(([x,z])=>{ const l=new THREE.PointLight("#fff3dd",0.35,30); l.position.set(x,3.4,z); szene.add(l); });
  const M=(farbe,extra={})=>new THREE.MeshLambertMaterial({color:farbe,...extra});
  const box=(w,h,d,mat,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); szene.add(m); return m; };
  // Boden + Außenflächen
  const boden=new THREE.Mesh(new THREE.PlaneGeometry(HALLE.L,HALLE.B),M("#b9b4aa")); boden.rotation.x=-Math.PI/2; boden.position.set(HALLE.L/2,0,HALLE.B/2); szene.add(boden);
  const aussen=new THREE.Mesh(new THREE.PlaneGeometry(140,100),M("#7b8f6a")); aussen.rotation.x=-Math.PI/2; aussen.position.set(HALLE.L/2,-0.02,HALLE.B/2); szene.add(aussen);
  // Bodenraster (1 m) für Maßgefühl
  { const pkt=[]; for(let x=1;x<HALLE.L;x++) pkt.push(x,0.006,0, x,0.006,HALLE.B); for(let z=1;z<HALLE.B;z++) pkt.push(0,0.006,z, HALLE.L,0.006,z);
    const gg=new THREE.BufferGeometry(); gg.setAttribute("position",new THREE.Float32BufferAttribute(pkt,3));
    szene.add(new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color:"#a39e93"}))); }
  // Wandhöhe am Ort y (Satteldach über die Breite)
  const hoehe=y=>HALLE.traufe+(HALLE.first-HALLE.traufe)*(1-Math.abs(y-HALLE.B/2)/(HALLE.B/2));
  const wandMat=M("#ece8df"), neuMat=M("#f2c14e"), bestandMat=M("#d9d4ca");
  // Längswände
  const t=HALLE.wand;
  const laengs=(z)=>{ const mesh=box(HALLE.L+t*2,HALLE.traufe,t,wandMat,HALLE.L/2,HALLE.traufe/2,z); return mesh; };
  // Südwand mit Türöffnung Haupteingang
  [[-t,32.6],[40.0,HALLE.L+t]].forEach(([a,b])=>box(b-a,HALLE.traufe,t,wandMat,(a+b)/2,HALLE.traufe/2,HALLE.B+t/2));
  box(40.0-32.6,HALLE.traufe-2.5,t,wandMat,36.3,2.5+(HALLE.traufe-2.5)/2,HALLE.B+t/2);
  box(40.0-32.6,2.5,0.05,new THREE.MeshLambertMaterial({color:"#a9c8e6",transparent:true,opacity:.45}),36.3,1.25,HALLE.B+t/2);
  [33.5,35.35,37.2,39.05].forEach(x=>box(0.08,2.5,0.1,M("#3a4150"),x,1.25,HALLE.B+t/2));
  laengs(-t/2);
  // Fensterband Nordwand
  for(let x=10.5;x<44;x+=2.3){ const f=box(1.6,1.5,0.06,new THREE.MeshLambertMaterial({color:"#9ec3e6",emissive:"#4a6d8f",emissiveIntensity:.35}),x,1.9,0.01); }
  // Giebelwände
  const giebel=(x)=>{ const s=new THREE.Shape(); s.moveTo(0,0); s.lineTo(HALLE.B,0); s.lineTo(HALLE.B,HALLE.traufe); s.lineTo(HALLE.B/2,HALLE.first); s.lineTo(0,HALLE.traufe); s.lineTo(0,0);
    const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false}); const m=new THREE.Mesh(g,wandMat); m.rotation.y=-Math.PI/2; m.position.set(x+t/2,0,0); szene.add(m); };

const FARBEN = ["#2b4fa0","#e2641a","#0e7490","#7c3aed","#be185d","#15803d","#a8321c","#ca8a04","#334155","#0369a1"];
const farbe = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return FARBEN[h%FARBEN.length]; };
const init = id => nameVon(id).split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const ava = (id,gr) => `<span class="avatar" style="background:${farbe(id)}${gr?`;width:${gr}px;height:${gr}px;font-size:${Math.round(gr*.38)}px`:''}" title="${esc(nameVon(id))}">${esc(init(id))}</span>`;
const avas = (ids,max=6) => `<span class="avatare">${ids.slice(0,max).map(i=>ava(i)).join("")}${ids.length>max?`<span class="avatar" style="background:var(--text3)">+${ids.length-max}</span>`:""}</span>`;
const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const dKurz = s => { if(!s) return ""; const d=new Date(s+"T12:00:00"); return `${WT[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`; };
const dLang = s => new Date(s+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const zeit = (v,b) => v||b ? `${(v||"").slice(0,5)}${b?"–"+b.slice(0,5):""} Uhr` : "ganztags";
const istLeitung = () => ["admin","bauleitung"].includes(S.me?.rolle);
const istAdmin = () => S.me?.rolle==="admin";
const teamVon = id => S.team.find(t=>t.id===id);
const gewerkFarbe = a => teamVon(a.team_id)?.farbe || "var(--linie)";
const zahlDe = n => (n==null||n==="") ? "" : String(n).replace(".",",");

/* ---------- Laden ---------- */
async function ladeAlles(){ await Promise.all(TABELLEN.map(async t=>{ try{ S[t]=await B.alle(t); }catch(e){ console.warn(t,e); S[t]=[]; } }));
  const ich=S.profil.find(p=>p.id===S.me?.id); if(ich) S.me=ich; }
let nachladenTimer={};
function nachladen(t){ clearTimeout(nachladenTimer[t]); nachladenTimer[t]=setTimeout(async()=>{ try{ S[t]=await B.alle(t); if(t==="profil"){ const ich=S.profil.find(p=>p.id===S.me.id); if(ich) S.me=ich; } }catch(e){}
  if(ansicht==="halle"){ if(t==="planobjekt") halleAktualisieren(); } else if(!document.querySelector(".schleier")) render(); },250); }
async function speichere(fn,meldung){ try{ const r=await fn(); if(meldung) toast(meldung); return r; }catch(e){ console.error(e); toast("Nicht gespeichert: "+(e.message||e)); throw e; } }

/* ---------- Rahmen ---------- */
/* Hell / dunkel: folgt dem Gerät, bis man selbst umschaltet (gilt dann auf diesem Gerät) */
function themaLesen(){ try{ return localStorage.getItem("gb-thema"); }catch(e){ return null; } }
function themaSetzen(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
function istDunkel(){ const t=document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
themaSetzen(themaLesen());
const themaKnopf = () => `<button class="btn thema-knopf" data-a="thema" aria-label="${istDunkel()?"Hellen Modus einschalten":"Dunklen Modus einschalten"}" title="${istDunkel()?"Hell":"Dunkel"}">${icon(istDunkel()?"sonne":"mond")}</button>`;

    ${B.modus==="demo"?`<div class="demo-band"><b>Vorschau mit Beispieldaten.</b> Alles, was du hier einträgst, bleibt nur in diesem Browser. Die echte Seite für die Gemeinde läuft mit eigener Anmeldung. <button class="btn klein" data-a="demoReset">Beispieldaten zurücksetzen</button></div>`:""}

</div>`;
}
const rolleText = r => ({admin:"Admin · Bauleitung",bauleitung:"Bauleitung",mitglied:"Gemeindemitglied"})[r]||r;
function render(){ if(dreiD){ dreiD.stop(); dreiD=null; }
  document.getElementById("wurzel").innerHTML = rahmen(); nachRender(); }
function nachRender(){
  if(ansicht==="halle") halleStarten();
  fotosAufloesen(document);
}
async function fotosAufloesen(root){ const imgs=$$("img[data-foto]",root); const fehlend=[...new Set(imgs.map(i=>i.dataset.foto).filter(p=>!S.urls[p]))];
  if(fehlend.length){ try{ Object.assign(S.urls, await B.fotoUrls(fehlend)); }catch(e){} }
  imgs.forEach(i=>{ const u=S.urls[i.dataset.foto]; if(u) i.src=u; }); }
const fotoImg = p => `<img data-foto="${esc(p)}" alt="Baustellenfoto" loading="lazy" ${p.startsWith("data:")?`src="${p}"`:""}>`;

/* ---------- Dialog & Meldungen ---------- */
function oeffne(titel,html,unter=""){ schliesse(); const s=document.createElement("div"); s.className="schleier";
  s.innerHTML=`<div class="schublade" role="dialog" aria-modal="true" aria-label="${esc(titel)}"><header><div><h2>${esc(titel)}</h2>${unter?`<p class="leise klein" style="margin-top:4px">${unter}</p>`:""}</div><button class="btn still" data-a="zu" aria-label="Schließen">${icon("zu")}</button></header>${html}</div>`;
  s.addEventListener("click",e=>{ if(e.target===s) schliesse(); }); document.body.appendChild(s); fotosAufloesen(s); setTimeout(()=>s.querySelector("input,textarea,select")?.focus({preventScroll:true}),50); return s; }
function schliesse(){ $$(".schleier").forEach(x=>x.remove()); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") schliesse(); });
function toast(t){ $$(".toast").forEach(x=>x.remove()); const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ================= Ansichten ================= */
const ANSICHTEN = {};

/* ---------- Start ---------- */
ANSICHTEN.start = () => {

    <p class="unter">${istLeitung()?"Deine Bauleitungs-Übersicht.":"Schön, dass du mit anpackst."} Samstage sind die großen Bautage.</p></div>
    <div class="zeile"><button class="btn primaer" data-a="verfOeffnen" data-datum="${sa}">${icon("kalender")}Ich bin da …</button><button class="btn" data-a="eintragNeu">${icon("foto")}Foto & Notiz</button><button class="btn" data-a="materialNeu">${icon("material")}Material anfragen</button></div></div>
  <div class="raster r2">
    <section class="karte"><header><div><p class="etikett">Tagesplan</p><h2>${dLang(tpD)}</h2></div>${tpP.length?`<span class="zahl">${tpF}<small>von ${tpP.length}</small></span>`:""}</header>
      ${tpP.length?`<div class="tp-balken" role="img" aria-label="${tpF} von ${tpP.length} erledigt"><i style="width:${Math.round(tpF/tpP.length*100)}%"></i></div>
        <div class="liste" style="margin-top:12px">${tpOffen.slice(0,4).map(x=>`<div class="zeile" style="flex-wrap:nowrap"><span class="punkt" style="background:var(--gold)"></span><span>${esc(x.titel)}${x.wer?` <span class="klein leise">· ${esc(x.wer)}</span>`:""}</span></div>`).join("")||`<p class="klein leise">Alles abgehakt.</p>`}</div>`
        :`<div class="leer">Für diesen Tag gibt es noch keinen Tagesplan.${istLeitung()?" Leg ihn an – mit Start, den Aufgaben des Tages und dem Aufräumen am Schluss.":""}</div>`}
      <div class="zeile" style="margin-top:14px"><button class="btn primaer" data-a="geh" data-ziel="tag" data-tag="${tpD}">${icon("tag")}${tpP.length?"Zum Tagesplan":istLeitung()?"Tagesplan anlegen":"Ansehen"}</button></div></section>
    <section class="karte" style="border-top:4px solid var(--flamme)"><header><div><p class="etikett">Nächster Bautag</p><h2>${dLang(sa)}</h2></div><span class="zahl">${daSa.length}<small>dabei</small></span></header>
      ${daSa.length?`<div class="stapel">${avas(daSa.map(v=>v.profil_id),10)}
        <div class="chips">${nachT.map(([t,n])=>`<span class="pille">${esc(t)} · ${n}</span>`).join("")}</div></div>`:`<div class="leer">Noch niemand eingetragen. Trag dich als Erster ein.</div>`}
      <div class="zeile" style="margin-top:14px">${ichSa?`<span class="pille erledigt">${icon("check","")}Du bist eingetragen</span><button class="btn klein" data-a="verfOeffnen" data-datum="${sa}">Ändern</button>`:`<button class="btn flamme" data-a="verfOeffnen" data-datum="${sa}">Ich bin dabei</button>`}<button class="btn still klein" data-a="tagOeffnen" data-datum="${sa}">Wer kommt wann?</button></div></section>
    <section class="karte"><header><h2>Meine Aufgaben</h2><span class="pille">${meine.length}</span></header>

    <section class="karte"><header><h2>Wer ist da? Nächste 14 Tage</h2><button class="btn still klein" data-a="geh" data-ziel="kalender">Kalender ${icon("rechts")}</button></header>
      <div class="leiste14">${tage.map((d,i)=>{ const sa_=new Date(d+"T12:00").getDay()===6; return `<button class="s ${sa_?"sa":""}" style="border:0;background:none;padding:0;cursor:pointer" data-a="tagOeffnen" data-datum="${d}" title="${dKurz(d)}: ${anz[i]} Personen"><span class="lbl">${anz[i]||""}</span><span style="height:64px;display:flex;align-items:flex-end;width:100%"><span class="bal" style="height:${Math.max(3,anz[i]/maxA*64)}px"></span></span><span class="lbl">${WT[new Date(d+"T12:00").getDay()]}</span></button>`; }).join("")}</div></section>
    <section class="karte"><header><h2>Baufortschritt</h2><span class="zahl">${proz}<small>%</small></span></header>

  </div>
  <section class="karte" style="margin-top:16px"><header><h2>Neu im Bautagebuch</h2><button class="btn still klein" data-a="geh" data-ziel="tagebuch">Alle Einträge ${icon("rechts")}</button></header>
    ${letzte.length?`<div class="raster r3">${letzte.map(eintragKarte).join("")}</div>`:`<div class="leer">Noch keine Einträge. Halte den ersten Fortschritt mit Foto fest.</div>`}</section>`;
};
function taetigkeitsZaehlung(liste){ const z={}; liste.forEach(v=>{ if(v.alles_gleich){ z["Alles gleich gern"]=(z["Alles gleich gern"]||0)+1; } else if(v.taetigkeiten[0]) z[v.taetigkeiten[0]]=(z[v.taetigkeiten[0]]||0)+1; });
  return Object.entries(z).sort((a,b)=>b[1]-a[1]); }
function eintragKarte(e){ const a=S.aufgabe.find(x=>x.id===e.aufgabe_id);
  return `<article class="stapel" style="gap:8px">${e.fotos.length?`<div class="foto-reihe">${e.fotos.slice(0,3).map(fotoImg).join("")}</div>`:""}
    <div class="zeile">${ava(e.autor,26)}<div class="klein"><b>${esc(nameVon(e.autor))}</b> <span class="leise">· ${dKurz(e.datum)}</span>${a?`<div class="leise">${esc(a.titel)}</div>`:""}</div></div>
    <p>${esc(e.text||"")}</p></article>`; }

/* ---------- Tagesplan ---------- */
let tpDatum=null;
function tpStandard(){ const h=heuteIso(); const tage=[...new Set(S.tagesplan_punkt.map(x=>x.datum))].sort();
  if(tage.includes(h)) return h; return tage.find(d=>d>h) || (new Date().getDay()===6?h:naechsterSamstag()); }
const uhr = s => s ? new Date(s).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : "";
function tpPunkt(x){ const auf=x.aufgabe_id&&S.aufgabe.find(y=>y.id===x.aufgabe_id);
  return `<div class="tp-punkt${x.erledigt?" fertig":""}">
    <button class="tp-haken" data-a="tpHaken" data-id="${x.id}" aria-pressed="${!!x.erledigt}" aria-label="${esc(x.titel)}: ${x.erledigt?"erledigt – wieder öffnen":"abhaken"}">${icon("check")}</button>
    <div class="tp-text"><b>${esc(x.titel)}</b>${x.wer?`<span class="tp-wer">${icon("teams")}${esc(x.wer)}</span>`:""}${x.notiz?`<span class="klein leise">${esc(x.notiz)}</span>`:""}
      ${x.erledigt?`<span class="tp-wann">${icon("check")}${esc(x.erledigt_von?vorname(x.erledigt_von):"erledigt")}${x.erledigt_um?" · "+uhr(x.erledigt_um)+" Uhr":""}</span>`:""}</div>
    <div class="tp-aktionen">${auf?`<button class="btn still klein" data-a="aufgabe" data-id="${auf.id}" aria-label="Aufgabe öffnen" title="Aufgabe öffnen">${icon("aufgaben")}</button>`:""}${istLeitung()?`<button class="btn still klein" data-a="tpLoeschen" data-id="${x.id}" aria-label="Punkt entfernen" title="Entfernen">${icon("zu")}</button>`:""}</div></div>`; }
ANSICHTEN.tag = () => {
  if(!tpDatum) tpDatum=tpStandard();
  const d=tpDatum, pk=S.tagesplan_punkt.filter(x=>x.datum===d).sort((x,y)=>x.sort-y.sort||(x.erstellt||"").localeCompare(y.erstellt||""));
  const fertig=pk.filter(x=>x.erledigt).length; const da=S.verfuegbarkeit.filter(v=>v.datum===d);
  const fehlend=S.aufgabe.filter(x=>x.datum===d&&x.status!=="erledigt"&&!pk.some(y=>y.aufgabe_id===x.id));
  const kopf=`<div class="kopf"><div><p class="etikett">Bautag</p><h1>Tagesplan</h1><p class="unter">${dLang(d)}${da.length?` · ${da.length} ${da.length===1?"Person":"Personen"} eingetragen`:""}</p></div>
    <div class="zeile tp-nav"><button class="btn still" data-a="tpTag" data-d="-1" aria-label="Voriger Tag">${icon("links")}</button><input type="date" id="tp-datum" data-a="tpDatum" value="${d}" aria-label="Datum" style="width:auto"><button class="btn still" data-a="tpTag" data-d="1" aria-label="Nächster Tag">${icon("rechts")}</button><button class="btn klein" data-a="tpTag" data-d="0">Heute</button>${pk.length?`<button class="btn klein" data-a="tpDrucken">Drucken</button>`:""}</div></div>`;
  if(!pk.length) return kopf+`<div class="tp-wrap"><section class="karte stapel" style="align-items:flex-start"><h2>Noch kein Tagesplan</h2>
    <p class="leise">${istLeitung()?`Der Tagesplan bekommt feste Punkte zum Start (Einweisung, Gerüste prüfen …) und zum Schluss (Werkzeug reinigen und aufräumen, sauber machen, abschließen) und dazu die Aufgaben, die für diesen Tag geplant sind${fehlend.length?` – im Moment ${fehlend.length}`:""}. Danach kannst du alles ergänzen oder streichen.`:"Die Bauleitung legt den Tagesplan an. Dann kannst du hier abhaken, was erledigt ist."}</p>
    ${istLeitung()?`<button class="btn primaer" data-a="tpAnlegen">${icon("tag")}Tagesplan anlegen</button>`:""}</section></div>`;
  const abschnitt=([k,titel])=>{ const l=pk.filter(x=>x.abschnitt===k), f=l.filter(x=>x.erledigt).length;
    return `<section class="karte"><header><h2>${titel}</h2><div class="zeile"><span class="pille ${l.length&&f===l.length?"erledigt":""}">${f} / ${l.length}</span>${istLeitung()?`<button class="btn still klein" data-a="tpNeu" data-k="${k}">${icon("plus")}Punkt</button>`:""}</div></header>
      ${k==="arbeit"&&istLeitung()&&fehlend.length?`<div class="hinweis zeile weit" style="margin-bottom:10px"><span>${fehlend.length===1?"1 Aufgabe ist":fehlend.length+" Aufgaben sind"} für diesen Tag geplant, aber noch nicht im Tagesplan.</span><button class="btn klein" data-a="tpAufgabenNach">Übernehmen</button></div>`:""}
      ${l.length?`<div class="tp-liste">${l.map(tpPunkt).join("")}</div>`:`<p class="klein leise">Noch keine Punkte.</p>`}</section>`; };

ANSICHTEN.kalender = () => {
  const j=kalMonat.getFullYear(), m=kalMonat.getMonth(); const erster=new Date(j,m,1), start=new Date(erster); start.setDate(1-((erster.getDay()+6)%7));
  const heute=heuteIso(); const zellen=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const s=iso(d); const da=S.verfuegbarkeit.filter(v=>v.datum===s);
    const ich=da.some(v=>v.profil_id===S.me.id), gew=mehrfach&&mehrfach.has(s); const plan=S.aufgabe.filter(a=>a.datum===s).length;
    zellen.push(`<button class="tag ${d.getMonth()!==m?"fremd":""} ${d.getDay()===6?"sa":""} ${s===heute?"heute":""} ${ich?"ich-da":""}" style="${gew?"outline:3px solid var(--flamme);outline-offset:-3px":""}" data-a="${mehrfach?"mehrTag":"tagOeffnen"}" data-datum="${s}" aria-label="${dLang(s)}, ${da.length} Personen">
      <span class="nr">${d.getDate()}<span class="anz">${da.length?da.length+" "+(da.length===1?"Pers.":"Pers."):""}</span></span>
      <span class="namen">${da.map(v=>esc(vorname(v.profil_id))).join(", ")}</span>${plan?`<span class="pille" style="font-size:10.5px;padding:1px 6px">${plan} Aufg.</span>`:""}</button>`); }
  const monatName=kalMonat.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  return `<div class="kopf"><div><p class="etikett">Wer ist wann da?</p><h1>Kalender</h1><p class="unter">Tippe auf einen Tag, um zu sehen, wer kommt, und dich selbst einzutragen. <span class="pille" style="background:var(--gold-weich);color:var(--warn)">Samstag = großer Bautag</span></p></div>
    <div class="zeile">${mehrfach?`<span class="klein leise">${mehrfach.size} Tage gewählt</span><button class="btn primaer" data-a="mehrEintragen" ${mehrfach.size?"":"disabled"}>Für diese Tage eintragen</button><button class="btn still" data-a="mehrAus">Abbrechen</button>`:`<button class="btn" data-a="mehrAn">${icon("kalender")}Mehrere Tage auf einmal</button>`}</div></div>
  <section class="karte"><header><div class="zeile"><button class="btn still" data-a="monat" data-d="-1" aria-label="Voriger Monat">${icon("links")}</button><h2 style="min-width:170px;text-align:center">${monatName}</h2><button class="btn still" data-a="monat" data-d="1" aria-label="Nächster Monat">${icon("rechts")}</button></div>
    <button class="btn klein" data-a="monat" data-d="0">Heute</button></header>
    <div class="kal">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<div class="wt">${w}</div>`).join("")}${zellen.join("")}</div>
    <p class="klein leise" style="margin-top:12px">Orange Unterkante = du bist eingetragen.</p></section>`;
};

function verfDialog(daten){
  const eins=daten.length===1; const vorh=eins?S.verfuegbarkeit.find(v=>v.datum===daten[0]&&v.profil_id===S.me.id):null;
  const reihe=vorh?[...vorh.taetigkeiten]:[...(S.me.schwerpunkte||[])]; const gleich=vorh?vorh.alles_gleich:false;
  const sa=new Date(daten[0]+"T12:00").getDay()===6;
  const s=oeffne(eins?dLang(daten[0]):`${daten.length} Tage eintragen`, `
    <form class="stapel" data-form="verf" data-daten="${daten.join(",")}" ${vorh?`data-id="${vorh.id}"`:""}>
      ${!eins?`<p class="klein leise">${daten.map(dKurz).join(" · ")}</p>`:""}
      <div class="felder"><label class="feld">Von<input type="time" name="von" id="v-von" value="${(vorh?.von||(sa?"08:00":"17:00")).slice(0,5)}"></label><label class="feld">Bis<input type="time" name="bis" id="v-bis" value="${(vorh?.bis||(sa?"17:00":"20:00")).slice(0,5)}"></label></div>
      <div class="stapel" style="gap:6px"><span class="etikett">Was machst du am liebsten?</span><p class="klein leise">Tippe in der Reihenfolge deiner Wünsche. Die Zahl zeigt die Rangfolge, erneut tippen nimmt es heraus.</p>
        <label class="zeile klein" style="font-weight:600"><input type="checkbox" name="gleich" id="v-gleich" ${gleich?"checked":""}> Ich mache alles gleich gern</label>
        <div class="chips" id="v-chips" ${gleich?'style="opacity:.4;pointer-events:none"':""}>${TAETIGKEITEN.map(t=>{ const i=reihe.indexOf(t); return `<button type="button" class="chip" data-a="rang" data-t="${esc(t)}" aria-pressed="${i>=0}">${i>=0?`<span class="nr">${i+1}</span>`:""}${esc(t)}</button>`; }).join("")}</div></div>
      <label class="feld">Notiz (optional)<input type="text" name="notiz" id="v-notiz" value="${esc(vorh?.notiz||"")}" placeholder="z. B. bringe Mörtelrührer mit, komme erst nach dem Mittag"></label>
      <div class="zeile"><button class="btn primaer" type="submit">${icon("check")}Speichern</button>${vorh?`<button class="btn gefahr" type="button" data-a="verfLoeschen" data-id="${vorh.id}">Austragen</button>`:""}</div>
    </form>`);
  s._reihe=reihe;
  s.querySelector("#v-gleich").addEventListener("change",e=>{ const c=s.querySelector("#v-chips"); c.style.opacity=e.target.checked?.4:1; c.style.pointerEvents=e.target.checked?"none":""; });
}

function auswahlLeiste(){ const o=S.planobjekt.find(x=>x.id===planAuswahl); if(!o) return `<p class="klein leise">Tippe ein Objekt an, um es zu drehen oder zu entfernen.</p>`;
  return `<div class="zeile"><b>${esc(OBJEKTE[o.typ]?.n||o.typ)}</b><span class="mass leise">x ${o.x.toFixed(1).replace(".",",")} m · y ${o.y.toFixed(1).replace(".",",")} m · ${Math.round(o.rot||0)}°</span>
    <button class="btn klein" data-a="objDreh" data-g="15">${icon("drehen")}15°</button><button class="btn klein" data-a="objDreh" data-g="90">${icon("drehen")}90°</button><button class="btn klein gefahr" data-a="objWeg">${icon("papierkorb")}Entfernen</button></div>`; }
function halleAktualisieren(){ const p=$("#plan-svg"); if(p&&!planZug){ p.innerHTML=planSvg(S.planobjekt,{bearbeiten:true,auswahl:planAuswahl,bestuhlung:bestuhlungN(),seiten:seitenAn()}); const a=$("#auswahl-leiste"); if(a) a.innerHTML=auswahlLeiste();
  const z=$("#plaetze"); if(z) z.textContent=sitzText(); }
  if(dreiD){ dreiD.objekte(S.planobjekt); if(dreiD._n!==bestuhlungN()){ dreiD._n=bestuhlungN(); dreiD.bestuhlung(dreiD._n); } if(dreiD._s!==seitenAn()){ dreiD._s=seitenAn(); dreiD.seiten(dreiD._s); } } }
let planZug=null;
function halleStarten(){
  if(halleReiter==="3d"){ const c=$("#dreid"); if(c){ dreiD=halle3d(c,S.planobjekt,{logo:LOGO,stoff:STOFF,bestuhlung:bestuhlungN(),seiten:seitenAn()}); dreiD._n=bestuhlungN(); dreiD._s=seitenAn(); } return; }
  const rahmen=$("#plan-svg"); if(!rahmen) return;
  const punkt=(svg,e)=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const m=pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:(m.x-40)/20,y:(m.y-40)/20}; };
  rahmen.addEventListener("pointerdown",e=>{ const g=e.target.closest("[data-obj]"); const svg=rahmen.querySelector("svg"); if(!g){ if(planAuswahl){ planAuswahl=null; halleAktualisieren(); } return; }
    const o=S.planobjekt.find(x=>x.id===g.dataset.obj); if(!o) return; const p=punkt(svg,e); planAuswahl=o.id; halleAktualisieren();
    planZug={o,dx:p.x-o.x,dy:p.y-o.y,bewegt:false}; rahmen.setPointerCapture(e.pointerId); e.preventDefault(); });
  rahmen.addEventListener("pointermove",e=>{ if(!planZug) return; const svg=rahmen.querySelector("svg"); const p=punkt(svg,e);
    const nx=Math.max(0.2,Math.min(HALLE.L-0.2,p.x-planZug.dx)), ny=Math.max(0.2,Math.min(HALLE.B-0.2,p.y-planZug.dy));
    planZug.o.x=Math.round(nx*10)/10; planZug.o.y=Math.round(ny*10)/10; planZug.bewegt=true;
    const g=svg.querySelector(`[data-obj="${planZug.o.id}"]`); if(g) g.setAttribute("transform",`translate(${planZug.o.x*20+40} ${planZug.o.y*20+40}) rotate(${planZug.o.rot||0})`); });
  const los=async()=>{ if(!planZug) return; const {o,bewegt}=planZug; planZug=null; if(bewegt){ try{ await B.aendern("planobjekt",o.id,{x:o.x,y:o.y,geaendert:new Date().toISOString()}); }catch(e){ toast("Nicht gespeichert"); } } halleAktualisieren(); };
  rahmen.addEventListener("pointerup",los); rahmen.addEventListener("pointercancel",los);
}

function startpasswort(){ const w=["Kelle","Ziegel","Balken","Hammer","Leiter","Eimer","Bohrer","Mauer","Fenster","Zange","Saege","Moertel"];
  const r=new Uint32Array(3); crypto.getRandomValues(r); return `${w[r[0]%w.length]}-${String(1000+r[1]%9000)}-${w[r[2]%w.length]}`; }

    try{ await speichere(()=>B.aendern("tagesplan_punkt",x.id,w)); }catch(e){} await neu("tagesplan_punkt"); render(); },
  tpNeu:t=>tpDialog(t.dataset.k||"arbeit"),
  tpLoeschen:async t=>{ await speichere(()=>B.loeschen("tagesplan_punkt",t.dataset.id),"Punkt entfernt"); await neu("tagesplan_punkt"); render(); },
  tpDrucken:()=>{ const vorher=document.documentElement.dataset.theme; themaSetzen("light"); setTimeout(()=>{ window.print(); themaSetzen(vorher||null); },50); },
  thema:()=>{ const neu=istDunkel()?"light":"dark"; themaSetzen(neu); try{ localStorage.setItem("gb-thema",neu); }catch(e){}
    $$(".thema-knopf").forEach(k=>k.outerHTML=themaKnopf()); if(ansicht==="halle"&&!document.querySelector(".tor")) render(); },
  abmelden:async ()=>{ await B.abmelden(); location.reload(); },
  zugangNeu:()=>zugangDialog(),
  bkKopieren:async ()=>{ const txt=neueZugaenge.map(w=>`${w.name} (${rolleText(w.rolle)})\nE-Mail: ${w.email}\nStartpasswort: ${w.pw}`).join("\n\n")+`\n\nSeite: ${APP_URL}`;
    try{ await navigator.clipboard.writeText(txt); toast("Zugangsdaten kopiert"); }catch(e){ toast("Kopieren ging nicht"); } },
  bkDrucken:()=>{ document.body.classList.add("druck-zugaenge"); const vorher=document.documentElement.dataset.theme; themaSetzen("light");
    setTimeout(()=>{ window.print(); document.body.classList.remove("druck-zugaenge"); themaSetzen(vorher||null); },50); },
  pwWuerfeln:t=>{ const i=t.closest("form").querySelector("#z-pw"); i.value=startpasswort(); i.focus(); },
  kopieren:async t=>{ const txt=document.getElementById(t.dataset.quelle)?.textContent||""; try{ await navigator.clipboard.writeText(txt); toast("Kopiert"); }catch(e){ toast("Kopieren ging nicht – Text bitte markieren"); } },
  benutzerNeuLaden:()=>{ benutzerInfo=null; neu("profil").then(render); },
  sperren:async t=>{ const an=t.dataset.k==="1"; await speichere(()=>B.sperren(t.dataset.id,an),an?"Zugang gesperrt":"Zugang wieder frei"); await neu("profil"); render(); }
};
async function neu(t){ try{ S[t]=await B.alle(t); }catch(e){} }
document.addEventListener("click",e=>{ const t=e.target.closest("[data-a]"); if(!t||t.tagName==="SELECT"||(t.tagName==="INPUT"&&t.type!=="checkbox")) return; if(t.type==="checkbox"&&t.dataset.a!=="neuGelb") return; const f=AKT[t.dataset.a]; if(f){ f(t,e); } });
document.addEventListener("change",async e=>{ const t=e.target; const a=t.dataset?.a;
  if(t.matches('input[type=file]')){ const z=t.closest("form")?.querySelector("[data-fotozahl]"); if(z) z.textContent=t.files.length?`${t.files.length} Foto${t.files.length>1?"s":""} gewählt`:""; }
  if(a==="filterG"){ filterA.gewerk=t.value; render(); }
  if(a==="filterP"){ filterA.phase=t.value; render(); }
  if(a==="tpDatum"&&t.value){ tpDatum=t.value; render(); }
  if(a==="mStatusSel"){ await speichere(()=>B.aendern("material",t.dataset.id,{status:t.value}),MSTATUS[t.value]); await neu("material"); }
  if(a==="rolle"){ await speichere(()=>B.aendern("profil",t.dataset.id,{rolle:t.value}),"Rolle geändert"); await neu("profil"); render(); }
  if(a==="neuGelb") dreiD?.neueHervorheben(t.checked);
});
document.addEventListener("input",e=>{ if(e.target.dataset?.a==="suchW"){ suchW=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#w-suche"); if(i){ i.focus(); i.setSelectionRange(pos,pos); } } });

/* ================= Formulare ================= */
const FORM = {
  verf:async f=>{ const s=f.closest(".schleier"); const daten=f.dataset.daten.split(","); const gleich=f.gleich.checked;
    const werte={von:f.von.value||null,bis:f.bis.value||null,taetigkeiten:gleich?[]:[...s._reihe],alles_gleich:gleich,notiz:f.notiz.value.trim()||null};
    for(const d of daten){ const vorh=S.verfuegbarkeit.find(v=>v.datum===d&&v.profil_id===S.me.id);
      await speichere(()=>vorh?B.aendern("verfuegbarkeit",vorh.id,werte):B.neu("verfuegbarkeit",{...werte,datum:d,profil_id:S.me.id})); }
    toast(daten.length>1?`${daten.length} Tage eingetragen`:"Eingetragen"); mehrfach=null; await neu("verfuegbarkeit"); schliesse(); render(); },
  aufgabe:async f=>{ const zug=$$('[data-a="zug"][aria-pressed="true"]',f).map(b=>b.dataset.id);
    const w={titel:f.titel.value.trim(),beschreibung:f.beschreibung.value.trim()||null,gewerk:f.gewerk.value||null,bereich:f.bereich.value||null,phase:f.phase.value===""?null:+f.phase.value,datum:f.datum.value||null,team_id:f.team_id.value||null,prio:+f.prio.value,zugewiesen:zug};
    if(f.status) w.status=f.status.value;
    const id=f.dataset.id; if(id) w.vorschlag=false;
    const r=await speichere(()=>id?B.aendern("aufgabe",id,w):B.neu("aufgabe",{...w,status:"offen"}),"Gespeichert"); await neu("aufgabe"); render(); aufgabeDialog(id||r.id); },
  eintrag:async f=>{ const knopf=f.querySelector("[type=submit]"); knopf.disabled=true; knopf.textContent="Speichert …";
    try{ const fotos=[]; for(const d of [...(f.fotos?.files||[])]) fotos.push(await B.fotoHoch(d));
      const text=(f.text.value||"").trim(); if(!text&&!fotos.length){ toast("Bitte Text oder Foto angeben"); knopf.disabled=false; knopf.textContent="Speichern"; return; }
      const aufgabe_id=f.aufgabe_id?.value||f.dataset.aufgabe||null;
      await speichere(()=>B.neu("eintrag",{datum:f.datum?.value||heuteIso(),text:text||null,aufgabe_id,fotos,autor:S.me.id}),"Eintrag gespeichert");
      await neu("eintrag"); if(f.dataset.aufgabe&&!f.datum){ aufgabeDialog(f.dataset.aufgabe); } else schliesse(); render();
    }catch(e){ knopf.disabled=false; knopf.textContent="Speichern"; } },
  material:async f=>{ const w={name:f.elements.name.value.trim(),menge:f.menge.value?+f.menge.value:null,einheit:f.einheit.value.trim()||null,gewerk:f.gewerk.value||null,aufgabe_id:f.aufgabe_id.value||null,notiz:f.notiz.value.trim()||null,status:"angefragt",angefragt_von:S.me.id};
    await speichere(()=>B.neu("material",w),"Anfrage gesendet"); await neu("material"); schliesse(); render(); },
  werkzeug:async f=>{ await speichere(()=>B.neu("werkzeug",{name:f.elements.name.value.trim(),kategorie:f.kategorie.value,anzahl:+f.anzahl.value||1,verfuegbarkeit:f.verfuegbarkeit.value,notiz:f.notiz.value.trim()||null,besitzer:S.me.id}),"Eingetragen. Danke!"); await neu("werkzeug"); schliesse(); render(); },
  team:async f=>{ const w={name:f.elements.name.value.trim(),gewerk:f.gewerk.value||null,leiter:f.leiter.value.trim()||null,farbe:f.farbe.value,beschreibung:f.beschreibung.value.trim()||null};
    await speichere(()=>f.dataset.id?B.aendern("team",f.dataset.id,w):B.neu("team",{...w,sort:S.team.length+1}),"Gespeichert"); await neu("team"); schliesse(); render(); },
  profil:async f=>{ const sw=$$('[data-a="schwer"][aria-pressed="true"]',f).map(b=>b.dataset.t);
    await speichere(()=>B.aendern("profil",S.me.id,{name:f.elements.name.value.trim(),telefon:f.telefon.value.trim()||null,hinweis:f.hinweis.value.trim()||null,schwerpunkte:sw}),"Profil gespeichert");
    await neu("profil"); S.me=S.profil.find(p=>p.id===S.me.id)||S.me; render(); },
  code:async f=>{ await speichere(()=>B.codeSetzen(f.code.value),"Code geändert"); merkeCode(f.code.value.trim()); f.reset(); render(); },
  tpPunkt:async f=>{ const auf=S.aufgabe.find(x=>x.id===f.aufgabe_id.value)||null; const titel=f.titel.value.trim()||auf?.titel||"";
    if(!titel){ toast("Bitte eintragen, was zu tun ist"); f.titel.focus(); return; }
    const abschnitt=f.abschnitt.value; const pk=S.tagesplan_punkt.filter(x=>x.datum===tpDatum&&x.abschnitt===abschnitt);
    const notiz=f.notiz.value.trim()||(auf?.gewerk==="Mauern (Ytong)"?TP_MAUERN:null);
    await speichere(()=>B.neu("tagesplan_punkt",{datum:tpDatum,abschnitt,titel,wer:f.wer.value.trim()||null,notiz,aufgabe_id:auf?.id||null,sort:Math.max(-1,...pk.map(x=>x.sort))+1,erledigt:false}),"Hinzugefügt");
    await neu("tagesplan_punkt"); schliesse(); render(); },
  bekannt:async f=>{ const l=S.leitung.find(x=>x.id===f.dataset.id); if(!l) return;
    const w={name:l.name,email:f.email.value.trim().toLowerCase(),rolle:f.rolle.value,pw:f.pw.value.trim()};
    const knopf=f.querySelector("[type=submit]"); knopf.disabled=true; knopf.textContent="Legt an …";
    try{ const r=await B.zugangAnlegen(w); neueZugaenge.push(w); if(r?.bestaetigen) toast("Achtung: In Supabase ist „Confirm email“ noch an");
      else toast(l.name.split(" ")[0]+" hat jetzt einen Zugang");
      await neu("profil"); await neu("leitung"); benutzerInfo=null; render(); document.getElementById("bekannte")?.scrollIntoView({block:"start"}); }
    catch(e){ knopf.disabled=false; knopf.textContent="Anlegen"; toast(e.message||String(e)); } },
  zugang:async f=>{ const w={name:f.elements.name.value.trim(),email:f.email.value.trim().toLowerCase(),rolle:f.rolle.value,pw:f.pw.value.trim()};
    const knopf=f.querySelector("[type=submit]"); knopf.disabled=true; knopf.textContent="Legt an …";
    try{ const r=await B.zugangAnlegen(w); await neu("profil"); benutzerInfo=null; render(); zugangFertig(w,r); }
    catch(e){ zugangDialog(e.message||String(e),w); } },
  einladung:async (f,e)=>{ const code=f.code.value.trim(); merkeCode(code); const wie=e?.submitter?.value||"wa";
    const link=APP_URL+"?einladung="+encodeURIComponent(code);
    const text=`Hallo! Für den Umbau unserer Halle (Konzstraße 9) gibt es eine App für Aufgaben, Kalender und Bautagebuch. Leg dir dort deinen Zugang an:\n\n${link}\n\nName, E-Mail und ein Passwort eingeben – fertig. Der Gemeinde-Code ist schon eingetragen (${code}).`;
    if(wie==="kopie"){ try{ await navigator.clipboard.writeText(text); toast("Einladung kopiert"); }catch(_){ toast("Kopieren ging nicht"); } }
    else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener"); },
  pwAendern:async f=>{ if(f.pw1.value!==f.pw2.value) return toast("Die Passwörter stimmen nicht überein");
    await speichere(()=>B.passwortAendern(f.pw1.value),"Passwort geändert – gilt ab jetzt auf allen Geräten"); f.reset(); },
  vergessen:async f=>{ try{ await B.passwortVergessen(f.email.value.trim()); zeigeTor("anmelden","","Wenn die E-Mail registriert ist, kommt gleich ein Link. Schau auch im Spam-Ordner nach."); }
    catch(e){ zeigeTor("vergessen",e.message); } },
  neuesPasswort:async f=>{ if(f.pw1.value!==f.pw2.value) return zeigeTor("neuesPasswort","Die Passwörter stimmen nicht überein.");
    const erst=!!S.me?.pw_wechseln;
    try{ await B.passwortAendern(f.pw1.value); if(erst) await B.pwGewechselt(); history.replaceState(null,"",location.pathname); await nachAnmeldung(); }catch(e){ zeigeTor(erst?"erstesPasswort":"neuesPasswort",e.message); } },
  anmelden:async f=>{ try{ await B.anmelden(f.email.value.trim(),f.pw.value); await nachAnmeldung(); }catch(e){ zeigeTor("anmelden",e.message==="Invalid login credentials"?"E-Mail oder Passwort stimmt nicht.":e.message); } },
  registrieren:async f=>{ const name=f.elements.name.value.trim(), code=f.code.value.trim();
    try{ await B.registrieren(f.email.value.trim(),f.pw.value); await B.beitreten(code,name); await nachAnmeldung(); }
    catch(e){ const m=/registered/i.test(e.message)?"Diese E-Mail ist schon registriert. Bitte anmelden.":e.message; if(await B.sitzung()) zeigeTor("beitreten",m); else zeigeTor("registrieren",m); } },
  beitreten:async f=>{ try{ await B.beitreten(f.code.value.trim(),f.elements.name.value.trim()); await nachAnmeldung(); }catch(e){ zeigeTor("beitreten",e.message); } }
};
document.addEventListener("submit",e=>{ const f=e.target; if(!f.dataset?.form) return; e.preventDefault(); FORM[f.dataset.form]?.(f,e); });

async function nachAnmeldung(){ const p=await B.meinProfil(); if(!p) return zeigeTor("beitreten"); if(p.gesperrt) return zeigeTor("beitreten","Dein Zugang ist gesperrt. Bitte wende dich an die Bauleitung."); S.me=p;
  if(p.pw_wechseln&&B.modus==="live") return zeigeTor("erstesPasswort"); B.abonnieren(nachladen); await ladeAlles(); render(); }

/* ================= Start ================= */
async function starten(){
  let live=false; try{ live = !!(window.GB_KONFIG&&GB_KONFIG.url) && await LiveBackend.init(); }catch(e){ live=false; }
  if(live){ B=LiveBackend; const s=await B.sitzung(); if(!s) return zeigeTor(torCode?"registrieren":"anmelden");
    if(B.wiederherstellung) return zeigeTor("neuesPasswort"); return nachAnmeldung(); }
  B=DemoBackend; await B.init(); S.me=await B.meinProfil(); await ladeAlles(); render();
}
starten();

</script>
